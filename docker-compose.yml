services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviewpilot
      POSTGRES_USER: reviewpilot
      POSTGRES_PASSWORD: reviewpilot
    ports:
      - "5432:5432"
    volumes:
      - reviewpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewpilot -d reviewpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://reviewpilot:reviewpilot@db:5432/reviewpilot
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  reviewpilot_pgdata:
